<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulário 4</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container">

  <h4>Formulário 4</h4>

  <hr>

  <h3>Novo Usuário</h3>

  <div class="row g-2">

    <div class="col-12">
      <label class="form-label">Nome:</label>
      <input type="text" class="form-control" placeholder="Informe o nome...">
    </div>

  </div>

  <div class="row g-2">

    <div class="col-3">
      <label class="form-label">CPF:</label>
      <input type="text" class="form-control" placeholder="Informe o cpf">
    </div>

    <div class="col-6">
      <label class="form-label">Endereço:</label>
      <input type="text" class="form-control" placeholder="Informe o endereço...">
    </div>

    <div class="col-3">
      <label class="form-label">Nível:</label>
      <select class="form-select">
        <option>---</option>
      </select>
    </div>

  </div>

  <div class="row g-2">

    <div class="col-6">
      <label class="form-label">Email:</label>
      <input type="email" class="form-control" placeholder="Informe o email...">
    </div>

    <div class="col-3">
      <label class="form-label">Senha:</label>
      <input type="password" class="form-control" placeholder="Informe a senha...">
    </div>

    <div class="col-3">
      <label class="form-label">Status:</label>
      <select class="form-select">
        <option>---</option>
      </select>
    </div>

  </div>

  <div class="row">
    <div class="col d-flex justify-content-end gap-2">
      <button class="btn btn-success">Enviar</button>
      <button class="btn btn-outline-secondary">Cancelar</button>
    </div>
  </div>

</div>

</body>
</html>
