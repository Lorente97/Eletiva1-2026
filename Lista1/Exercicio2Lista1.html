<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulário 2</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<main class="container">

  <h4><strong>Formulário 2</strong></h4>

  <div class="row g-2">

    <div class="col-md-1">
      <label class="form-label"><strong>Código</strong></label>
      <input type="text" class="form-control" value="32">
    </div>

    <div class="col-md-5">
      <label class="form-label"><strong>Nome</strong></label>
      <input type="text" class="form-control" placeholder="Nome Completo do Cliente">
    </div>

    <div class="col-md-4">
      <label class="form-label"><strong>E-mail</strong></label>
      <input type="email" class="form-control" placeholder="cliente@dominio.com">
    </div>

    <div class="col-md-2">
      <label class="form-label"><strong>CPF</strong></label>
      <input type="text" class="form-control" placeholder="Só números">
    </div>

  </div>

  <div class="row g-2">

    <div class="col-md-3">
      <label class="form-label"><strong>Nº Celular</strong></label>
      <input type="text" class="form-control" placeholder="Nº do celular">
    </div>
    <div class="col-md-3">
      <label class="form-label"><strong>Nº Telefone fixo</strong></label>
      <input type="text" class="form-control" placeholder="Nº telefone">
    </div>
    <div class="col-md-2">
      <label class="form-label"><strong>CEP</strong></label>
      <input type="text" class="form-control" placeholder="ex:88308070">
    </div>
    <div class="col-md-3">
      <label class="form-label"><strong>Logradouro</strong></label>
      <input type="text" class="form-control" placeholder="ex:Rua 1400">
    </div>
    <div class="col-md-1">
      <label class="form-label"><strong>Nº</strong></label>
      <input type="text" class="form-control">
    </div>
  </div>
  <div class="row g-2">
    <div class="col-md-3">
      <label class="form-label"><strong>Bairro</strong></label>
      <input type="text" class="form-control">
    </div>
    <div class="col-md-3">
      <label class="form-label"><strong>Cidade</strong></label>
      <input type="text" class="form-control">
    </div>
    <div class="col-md-1">
      <label class="form-label"><strong>UF</strong></label>
      <input type="text" class="form-control">
    </div>
    <div class="col-md-2">
      <label class="form-label"><strong>Status</strong></label>
      <select class="form-select">
        <option>Selecione</option>
        <option>Ativo</option>
        <option>Inativo</option>
      </select>
    </div>
  </div>
  <div class="row">
    <div class="col d-flex justify-content-end gap-2">
      <button class="btn btn-danger">Resetar</button>
      <button class="btn btn-success">Próximo</button>
    </div>
  </div>
</main>
</body>
</html>
